<div class="scope">
  <canvas #scope aria-hidden="true"></canvas>
</div>
<div class="readout" [attr.aria-label]="t(ui.radarLabel)">
  <div class="head">
    <span class="live"></span>
    {{ t(ui.radarHead) }} · {{ contacts().length }} {{ t(ui.radarContacts) }}
  </div>
  <table>
    <tbody>
      @for (c of contacts(); track c.id) {
        <tr>
          <td>{{ c.id }}</td>
          <td>{{ c.bearing }}°</td>
          <td>{{ c.range }} m</td>
          <td>{{ c.alt }} m AGL</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4" class="idle">{{ t(ui.radarIdle) }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
